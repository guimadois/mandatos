{% if total_paginas > 1 %}
<nav class="paginacao" aria-label="Páginas">
  {% if anterior %}<a href="{{ anterior }}" rel="prev"><span aria-hidden="true">←</span> Mais recentes</a>{% else %}<span></span>{% endif %}
  <span class="apoio num">{{ pagina|milhar }} / {{ total_paginas|milhar }}</span>
  {% if proxima %}<a href="{{ proxima }}" rel="next">Mais antigas <span aria-hidden="true">→</span></a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
