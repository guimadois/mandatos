{% if total_paginas > 1 %}
<nav class="paginacao" aria-label="Páginas">
  {% if anterior %}<a href="{{ anterior }}" rel="prev">← Mais recentes</a>{% else %}<span></span>{% endif %}
  <span class="apoio num">{{ pagina|milhar }} / {{ total_paginas|milhar }}</span>
  {% if proxima %}<a href="{{ proxima }}" rel="next">Mais antigas →</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
