<li>
  <a class="tit" href="{{ p.url_origem }}" rel="noopener">{{ p.tipo }} nº {{ p.numero }}/{{ p.ano }}</a>
  <span class="det">
    <span class="num">{{ p.data|data_br }}</span>
    {% if p.situacao %}<span>Situação na Câmara: <span class="situacao">{{ p.situacao }}</span></span>{% endif %}
    {% if p.autores|length > 1 %}<span>Com {{ p.autores|rejectattr("id", "equalto", v.id_oficial)|map(attribute="nome")|join(", ") }}</span>{% endif %}
  </span>
</li>
